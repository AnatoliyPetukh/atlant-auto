<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-labelledby="title description">
  <title id="title">Atlant Auto</title>
  <desc id="description">Znak AA inspirowany owalnymi oznaczeniami kraju oraz nazwa Atlant Auto Warszawa</desc>
  <g fill="none" fill-rule="evenodd">
    <ellipse cx="78" cy="75" rx="61" ry="47" fill="#fff" stroke="#111827" stroke-width="7" data-country-badge="AA"/>
    <text x="78" y="94" fill="#111827" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:58px;font-weight:800;letter-spacing:-5px">AA</text>
    <text x="166" y="82" fill="#111827" style="font-family:Arial,Helvetica,sans-serif;font-size:57px;font-weight:700;letter-spacing:-2px">Atlant Auto</text>
    <text x="170" y="116" fill="#667085" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:600;letter-spacing:7px">WARSZAWA</text>
